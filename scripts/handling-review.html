<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>코너 주행 비교 검사</title><style>body{font:14px system-ui;background:#101d2b;color:#e7f7f7;margin:16px}button,select{min-height:44px;padding:8px;margin:4px;font:inherit}#stage{width:100%;height:880px;overflow:auto;background:#000}iframe{border:0}pre{white-space:pre-wrap;font-size:11px}#summary{padding:12px}body.capture{margin:0;overflow:hidden}body.capture>*:not(#stage){display:none}body.capture #stage{height:100vh;overflow:hidden}</style></head><body><h1>코너 주행 비교 · 로컬 검사</h1><p>합성 터치·브라우저 크기 재현입니다. 실제 iPhone·Android 하드웨어 검증은 아닙니다. 시안은 저장소를 사용하지 않습니다.</p><button id="run">12개 조합 검사</button><button id="scenario">주행 반응 검사</button><button id="brake-check">제동+조향 24개 검사</button><select id="size"><option>844x390</option><option>740x360</option><option>390x844</option><option>360x740</option><option>320x568</option><option>568x320</option></select><button id="prepare">장면 준비</button><button id="brake-scene">제동·왼쪽 조향 장면</button><button id="capture">게임 화면만 보기</button><p id="summary" role="status">준비 중</p><div id="stage"><iframe id="game" title="비교 시안" width="844" height="390" src="/handling-study.html?qa=1&review=1"></iframe></div><pre id="report">아직 실행하지 않았습니다.</pre><script type="module">
const frame=document.querySelector('#game'),$=s=>document.querySelector(s),report={checks:[],physics:[],runtimeErrors:[],nativePhoneVerified:false};
let w,d,qa;const wait=ms=>new Promise(r=>setTimeout(r,ms));const assert=(v,m)=>{if(!v)throw Error(m);};
async function ready(){for(let i=0;i<300;i++){w=frame.contentWindow;d=w.document;qa=w.__handlingQA;if(qa?.snapshot().ready){w.__cockpitReviewSetFrozen(true);return;}await wait(100);}throw Error('준비 시간 초과');}
function click(id){d.getElementById(id).click();}
function rect(id){const r=d.getElementById(id).getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height};}
function pointer(el,type,id,x,y){el.dispatchEvent(new w.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:id===1,button:0,buttons:type==='pointerup'||type==='pointercancel'?0:1,clientX:x,clientY:y}));}
function finger(id,action,type='pointerdown'){const b=d.querySelector('[data-action="'+action+'"]'),r=b.getBoundingClientRect();pointer(b,type,id,r.x+r.width/2,r.y+r.height/2);}
async function resize(size){const [width,height]=size.split('x').map(Number);frame.width=width;frame.height=height;await wait(80);return{width,height};}
function publish(){report.runtimeErrors=w?.__cockpitReviewErrors||[];$('#report').textContent=JSON.stringify(report,null,2);}
function start(mode){click(mode+'-mode');click('retry');click('start');return qa.snapshot();}
function canvasCheck(width,height){const s=qa.snapshot();assert(s.canvas.width===width&&s.canvas.height===height,'캔버스 크기');assert(Math.abs(s.camera.aspect-width/height)<1e-6,'카메라 비율');assert(s.original.invariant.passed,'원본 비율');return s;}
function controlBounds(width,height,mode){const ids=['[data-action=gas]','[data-action=brake]','[data-action=reverse]',...(mode==='buttons'?['[data-action=left]','[data-action=right]']:['#thumb-slider'])];return ids.map(sel=>{const b=d.querySelector(sel),r=b.getBoundingClientRect();assert(r.width>=48&&r.height>=48,sel+' 터치 크기');assert(r.left>=0&&r.top>=0&&r.right<=width+.1&&r.bottom<=height+.1,sel+' 화면 밖');assert(d.elementFromPoint(r.x+r.width/2,r.y+r.height/2)?.closest(sel)===b,sel+' 가림');return{selector:sel,x:r.x,y:r.y,width:r.width,height:r.height};});}
$('#run').onclick=async()=>{try{await ready();report.checks=[];for(const size of ['844x390','740x360','390x844','360x740','320x568','568x320'])for(const mode of ['buttons','slide']){
 $('#summary').textContent=size+' / '+mode;const {width,height}=await resize(size),initial=start(mode);assert(initial.state.x===0&&initial.state.z===-48&&initial.state.u===60/3.6,'공통 출발 조건');const bounds=controlBounds(width,height,mode);canvasCheck(width,height);
 if(mode==='buttons'){finger(1,'left');qa.advance(.2);const a=qa.snapshot();assert(a.state.steer>.02&&a.input.value>.1&&a.input.value<.5,'점진 조향');}
 else{const r=rect('thumb-slider');pointer(d.getElementById('thumb-slider'),'pointerdown',1,r.x+r.width*.4,r.y+r.height/2);qa.advance(.4);const a=qa.snapshot();assert(Math.abs(a.input.value-.25)<.001,'중간 각도');qa.advance(.3);assert(Math.abs(qa.snapshot().input.value-a.input.value)<.001,'각도 유지');pointer(d.getElementById('thumb-slider'),'pointermove',1,r.x+r.width*.37,r.y+r.height/2);qa.advance(.1);assert(qa.snapshot().input.value>a.input.value+.04,'미세 조정');}
 finger(2,'gas');qa.advance(.25);assert(qa.snapshot().input.held.length===2&&qa.snapshot().state.gas>.4,'두 손가락 동시 입력');finger(2,'gas','pointercancel');assert(qa.snapshot().input.held.length===1,'가속 취소 후 조향 유지');pointer(d,'pointerup',1,0,0);qa.advance(.8);assert(Math.abs(qa.snapshot().input.value)<.001,'조향 복귀');
 finger(2,'gas');click('pause');assert(qa.snapshot().paused&&qa.snapshot().input.held.length===0,'일시정지 입력 해제');click('resume');finger(2,'gas');const other=mode==='buttons'?'slide':'buttons';click(other+'-mode');assert(!qa.snapshot().running&&qa.snapshot().input.held.length===0&&qa.snapshot().state.time===0,'방식 변경 시 같은 출발로 복원');click(mode+'-mode');click('start');finger(2,'gas');w.dispatchEvent(new w.Event('blur'));assert(qa.snapshot().paused&&qa.snapshot().input.held.length===0,'창 전환 입력 해제');
 click('retry');click('view');assert(qa.snapshot().view==='chase','외부 시점');click('view');assert(qa.snapshot().view==='cockpit','실내 시점');const last=canvasCheck(width,height);report.checks.push({size,mode,passed:true,bounds,initial:{x:initial.state.x,z:initial.state.z,u:initial.state.u},camera:last.camera,sourceInvariant:last.original.invariant});publish();
 }$('#summary').textContent='12 / 12 조합 통과';}catch(error){report.error=error.stack;$('#summary').textContent='실패: '+error.message;}publish();};
$('#scenario').onclick=async()=>{try{await ready();delete report.error;report.physics=[];report.recoveries=[];await resize('844x390');
 for(const scenario of [{name:'저속 관성',speed:40,gas:0,seconds:1},{name:'고속 관성',speed:100,gas:0,seconds:1},{name:'강한 가속 회전',speed:60,gas:1,seconds:1.5}]){
  d.querySelector('input[name=speed][value="'+scenario.speed+'"]').click();start('slide');qa.restorePose({z:0});qa.advance(scenario.seconds,{steer:.25,throttle:scenario.gas});report.physics.push({scenario:scenario.name,state:qa.snapshot().state});
 }
 const [low,fast,power]=report.physics.map(a=>a.state);assert(low.underTime===0&&Math.abs(low.beta)<.04,'저속 접지');assert(fast.underTime>.7&&fast.frontSlip>low.frontSlip*3,'고속 앞 접지 한계');assert(power.overTime>.3&&Math.abs(power.beta)>.08&&Math.abs(power.beta)<.20,'점진적인 가속 뒤 미끄러짐');assert(report.physics.every(a=>a.state.hits===0),'물리 장면 충돌 없음');
 for(const size of ['844x390','390x844'])for(const mode of ['buttons','slide'])for(const c of [{brake:0,steer:0},{brake:.4,steer:0},{brake:1,steer:0},{brake:.4,steer:.25},{brake:1,steer:.25}]){
  await resize(size);d.querySelector('input[name=speed][value="60"]').click();start(mode);qa.restorePose({z:0});qa.advance(1.5,{steer:.25,throttle:1});const before=qa.snapshot().state;
  qa.advance(1.5,c);const after=qa.snapshot();assert(Math.abs(before.beta)>.08,'회복 전 실제 미끄러짐');assert(Math.abs(after.state.beta)<.02&&Math.abs(after.state.v)<.25&&Math.abs(after.state.yawRate)<.6,'입력 해제·감속 후 접지 회복');
  if(!c.steer)assert(Math.abs(after.state.yawRate)<.04,'정면 조향 회복');assert(after.state.hits===0,'벽 접촉 없이 회복');assert(after.original.invariant.passed,'원본 실내 비례');assert(!after.storageUsed,'저장 기록 미사용');
  report.recoveries.push({size,mode,input:c,before,after:after.state,passed:true});publish();
 }
 start('buttons');finger(1,'left');finger(2,'gas');await resize('844x390');assert(qa.snapshot().paused&&qa.snapshot().input.held.length===0,'회전 시 정지·입력 해제');canvasCheck(844,390);report.rotation={passed:true};
 report.physicsPassed=true;$('#summary').textContent='접지·한계 주행·20개 회복·회전 검사 통과';
 }catch(error){report.error=error.stack;$('#summary').textContent='실패: '+error.message;}publish();};
$('#brake-check').onclick=async()=>{try{await ready();report.brakeSteering=[];delete report.error;
 for(const size of ['844x390','390x844'])for(const mode of ['buttons','slide'])for(const speed of [40,60,100])for(const side of ['left','right']){
  $('#summary').textContent=size+' / '+mode+' / '+speed+' / '+side;
  await resize(size);d.querySelector('input[name=speed][value="'+speed+'"]').click();
  const initial=start(mode),sign=side==='left'?1:-1;
  if(mode==='buttons')finger(1,side);else{const r=rect('thumb-slider');pointer(d.getElementById('thumb-slider'),'pointerdown',1,r.x+r.width*(.5-sign*.1),r.y+r.height/2);}
  finger(2,'brake');qa.advance(.9);const s=qa.snapshot();
  assert(s.input.held.length===2&&s.state.braking===1,'제동+조향 동시 입력');
  assert(s.state.steer*sign>0&&s.state.heading*sign>0&&s.state.x*sign>0,'입력 방향으로 회전');
  assert(s.state.u<initial.state.u&&s.state.u>=0,'정상 감속');assert(s.state.hits===0,'충돌 없는 비교');assert(s.original.invariant.passed,'실내 비례');
  report.brakeSteering.push({size,mode,speed,side,passed:true,initial:{x:initial.state.x,z:initial.state.z,u:initial.state.u},state:s.state});
  finger(2,'brake','pointercancel');pointer(d,'pointerup',1,0,0);assert(qa.snapshot().input.held.length===0,'입력 해제');publish();
 }
 report.brakeSteeringPassed=true;$('#summary').textContent='24 / 24 제동+조향 검사 통과';
 }catch(error){report.error=error.stack;$('#summary').textContent='실패: '+error.message;}publish();};
$('#prepare').onclick=async()=>{await ready();await resize($('#size').value);d.querySelector('input[name=speed][value="60"]').click();start('slide');qa.advance(2.2,{});const r=rect('thumb-slider');pointer(d.getElementById('thumb-slider'),'pointerdown',1,r.x+r.width*.445,r.y+r.height/2);qa.advance(1.4);$('#summary').textContent='장면 준비 완료';};
$('#brake-scene').onclick=async()=>{await ready();await resize('844x390');d.querySelector('input[name=speed][value="60"]').click();start('buttons');finger(1,'left');finger(2,'brake');qa.advance(.7);$('#summary').textContent='브레이크와 왼쪽 조향 동시 입력 · 수정 후';};
$('#capture').onclick=()=>document.body.classList.add('capture');addEventListener('keydown',e=>{if(e.code==='Escape')document.body.classList.remove('capture');});
ready().then(()=>{$('#summary').textContent='준비 완료';}).catch(e=>{$('#summary').textContent=e.message;});
</script></body></html>
