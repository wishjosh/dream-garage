<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>본게임 차고 저장 검토</title><style>body{margin:0;background:#17191d;color:white;font:14px system-ui}header{height:44px;display:flex;gap:12px;align-items:center;padding:0 10px}button{padding:8px}iframe{display:block;border:0;width:100%;height:calc(100dvh - 44px)}</style><header>별도 검토 기록 <button id="reload">저장 후 다시 열기</button><button id="inspect">저장 확인</button><output id="state"></output></header><iframe id="game" title="본게임 차고" src="/?qa=1&review=1&review-persist=1&handling-save=1&garage=1&course=circuit"></iframe><script>document.getElementById('reload').onclick=()=>document.getElementById('game').contentWindow.location.reload();document.getElementById('inspect').onclick=()=>{const data=JSON.parse(window.__dreamGarageReviewMemory.get('hojin-city-gp:save:v1'));document.getElementById('state').textContent=JSON.stringify({coins:data.coins,races:data.races,car:data.car,paint:data.garage[data.car].paint,wheels:data.garage[data.car].wheels,best:data.best});};</script></html>
