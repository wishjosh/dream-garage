<!doctype html><meta charset="utf-8"><title>그래파이트 본게임 조작 검증</title><style>body{margin:16px;background:#10202c;color:#dbeee7;font:14px system-ui}button{padding:12px;margin:5px}iframe{border:0;display:block}#stage{overflow:auto}pre{white-space:pre-wrap}body.capture{margin:0;overflow:hidden}body.capture header,body.capture pre{display:none}body.capture iframe{position:fixed;inset:0}</style>
<header><h1>실제 게임 · 그래파이트 조작부 검증</h1><p>기록은 메모리에 격리합니다. 합성 터치·화면 크기 검증이며 실제 스마트폰 하드웨어 검사는 아닙니다.</p><button id="run">전체 조작·화면 검사</button><button id="show">운전석 보기</button><button id="capture">게임 화면만 보기</button><strong id="status">대기</strong></header><div id="stage"><iframe id="game" width="844" height="390" title="검사 중인 실제 게임"></iframe></div><pre id="report"></pre>
<script type="module">
const $=s=>document.querySelector(s),frame=$('#game'),w=()=>frame.contentWindow,d=()=>frame.contentDocument,q=s=>d().querySelector(s),qa=()=>w().__raceQA,snap=()=>qa().snapshot(),sleep=ms=>new Promise(r=>setTimeout(r,ms));let ready=false,report={checks:[]};
const assert=(v,m)=>{if(!v)throw Error(m)},click=s=>q(s).click();function change(s,v){q(s).value=v;q(s).dispatchEvent(new (w().Event)('change',{bubbles:true}));}
function box(el){const r=el.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom};}
const overlaps=(a,b)=>a.x<b.right-.5&&b.x<a.right-.5&&a.y<b.bottom-.5&&b.y<a.bottom-.5;
function record(name,fn){try{report.checks.push({name,passed:true,evidence:fn()});}catch(e){report.checks.push({name,passed:false,error:e.message});}$('#report').textContent=JSON.stringify(report,null,2);}
async function init(){if(ready)return;frame.src='/?qa=1&review=1&handling-save=1';for(let i=0;i<1200;i++){try{if(qa()&&!q('#enter-garage').disabled)break;}catch{}await sleep(50);}assert(w().__cockpitReviewStorageIsolated&&qa(),'격리 게임 준비 실패');w().__cockpitReviewSetFrozen(true);ready=true;}
function stub(){for(const el of d().querySelectorAll('[data-control],#drive-lever,#thumb-steering')){el.setPointerCapture=()=>{};el.releasePointerCapture=()=>{};el.hasPointerCapture=()=>false;}}
async function size(width,height){frame.width=width;frame.height=height;frame.style.width=width+'px';frame.style.height=height+'px';await sleep(70);w().dispatchEvent(new (w().Event)('resize'));}
function garage(){if(!q('#course-map').hidden)click('#map-resume');if(['race','countdown'].includes(snap().mode))click('#pause');if(snap().mode==='paused')click('#back-menu');if(snap().mode==='result')click('#result-menu');if(snap().screen==='welcome')click('#enter-garage');}
function start(car='tavaculo',view='cockpit'){garage();click('[data-car='+car+']');change('#view-select',view);change('#steering-mode','slide');q('#auto-throttle').checked=false;q('#auto-throttle').dispatchEvent(new (w().Event)('change',{bubbles:true}));click('#start');qa().advance(3.5,null);qa().advance(0,null);stub();}
function emit(el,type,id,x,y){const r=box(el);el.dispatchEvent(new (w().PointerEvent)(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:id===1,button:0,buttons:type==='pointerup'||type==='pointercancel'?0:1,clientX:x??r.x+r.width/2,clientY:y??r.y+r.height/2}));}
const gas=()=>q('[data-control=throttle]'),brake=()=>q('[data-control=brake]'),lever=()=>q('#drive-lever'),steer=()=>q('#thumb-steering');
function leverDown(id=2){emit(lever(),'pointerdown',id);return box(lever());}function leverMove(id,delta){const r=box(lever());emit(lever(),'pointermove',id,r.x+r.width/2,r.y+r.height/2+delta);}function tick(seconds){qa().advance(seconds,null);}
function neutral(){assert(!Object.values(snap().input).some(Boolean)&&snap().touches===0&&!snap().steeringControl.active&&snap().driveConsole.active===0,'입력 잔류');assert(snap().steeringControl.value===0&&snap().driveConsole.value===0,'중앙 복귀 실패');}
function releaseAll(){for(const [el,id]of [[steer(),1],[gas(),2],[brake(),3],[lever(),2],[lever(),4]])emit(el,'pointercancel',id);tick(1/60);}
function layout(){const sels=['#thumb-steering','[data-control=throttle]','[data-control=brake]','#drive-lever','#rescue','#speedometer','#map-open','.race-stats','.top-actions'];const rects=sels.map(s=>({selector:s,...box(q(s))}));for(const r of rects)assert(r.x>=-.5&&r.y>=-.5&&r.right<=w().innerWidth+.5&&r.bottom<=w().innerHeight+.5,'화면 밖 '+r.selector+JSON.stringify(r));for(const r of rects.slice(0,5)){assert(r.width>=44&&r.height>=44,'44px 미만 '+r.selector);const el=q(r.selector),hit=d().elementFromPoint(r.x+r.width/2,r.y+r.height/2);assert(hit===el||el.contains(hit),'가림 '+r.selector);}for(let i=0;i<rects.length;i++)for(let j=i+1;j<rects.length;j++)assert(!overlaps(rects[i],rects[j]),'겹침 '+rects[i].selector+'/'+rects[j].selector);assert([...d().querySelectorAll('[data-console-art] img')].every(im=>im.complete&&im.naturalWidth>0),'원화 로드 실패');return rects;}
async function finishCheck(car){
 start(car);const before=JSON.parse(w().localStorage.getItem('hojin-city-gp:save:v1'));
 for(let seconds=0;seconds<150&&snap().mode!=='result';seconds+=3){$('#status').textContent=car+' 도시 완주 검사 '+seconds+'초';qa().advanceDriver(3);await sleep(20);}
 record(car+' finish award once and customization retained',()=>{const end=snap();assert(end.mode==='result'&&end.races===before.races+1,'도시 완주 실패');assert([1000,650,400,150].includes(end.coins-before.coins),'상금 지급 실패');const stored=JSON.parse(w().localStorage.getItem('hojin-city-gp:save:v1'));for(const field of ['owned','garage','best'])assert(JSON.stringify(stored[field])===JSON.stringify(before[field]),'완주 뒤 기존 기록 손실 '+field);qa().advanceDriver(5);assert(snap().coins===end.coins&&snap().races===end.races,'상금 중복 지급');return{prize:end.coins-before.coins,races:end.races,loadoutsPreserved:true};});
}
async function run(){
 $('#run').disabled=true;report={checks:[],method:'isolated actual game + synthetic multitouch + fixed physics stepping'};
 try{await init();
 for(const [width,height]of [[844,390],[740,360],[568,320],[568,280],[640,240],[390,844],[320,568],[1024,768]])for(const car of ['tavaculo','f2002'])for(const view of ['cockpit','chase']){await size(width,height);start(car,view);$('#status').textContent=`화면 검사 ${width}×${height} ${car} ${view}`;record(`${width}x${height} ${car} ${view}`,layout);}
 await size(844,390);
 for(const car of ['tavaculo','f2002']){
  start(car);const saved=JSON.parse(w().localStorage.getItem('hojin-city-gp:save:v1'));
  record(car+' two thumbs acceleration and fine steering',()=>{const r=box(steer());emit(steer(),'pointerdown',1);emit(steer(),'pointermove',1,r.x+r.width/2-18);emit(gas(),'pointerdown',2);tick(1);const s=snap();assert(s.input.throttle&&s.steeringControl.value===.25&&s.player.speed>1,'동시 조향·가속 실패');emit(steer(),'pointerdown',9);emit(steer(),'pointermove',9,0);tick(1/60);assert(snap().steeringControl.value===.25,'다른 손가락이 조향 탈취');releaseAll();neutral();return{speed:s.player.speed,steer:s.steeringControl.value};});
  record(car+' brake priority and no reverse',()=>{emit(gas(),'pointerdown',2);tick(1);emit(brake(),'pointerdown',3);tick(4);assert(snap().player.speed<.3&&snap().player.forwardSpeed>-.2,'브레이크 우선 실패');releaseAll();neutral();});
  record(car+' reverse gate and neutral rearm',()=>{emit(gas(),'pointerdown',2);tick(1.5);emit(gas(),'pointerup',2);leverDown();leverMove(2,-45);tick(5);assert(snap().player.forwardSpeed>-.2&&snap().player.reverseBlocked,'주행 중 즉시 후진');leverMove(2,0);tick(.15);leverMove(2,-45);tick(1);assert(snap().player.forwardSpeed< -1,'중앙 복귀 후 후진 실패');emit(lever(),'pointerup',2);tick(1/60);neutral();});
  start(car);record(car+' drift with steering, no third thumb',()=>{emit(gas(),'pointerdown',2);tick(2);emit(gas(),'pointerup',2);const r=box(steer());emit(steer(),'pointerdown',1);emit(steer(),'pointermove',1,r.x+r.width/2-40);leverDown();leverMove(2,45);tick(.5);assert(snap().input.drift&&snap().player.drifting&&snap().player.speed>2,'두 엄지 드리프트 실패');releaseAll();neutral();});
  record(car+' gas to lever to gas transfer',()=>{emit(gas(),'pointerdown',2);const l=box(lever());emit(gas(),'pointermove',2,l.x+l.width/2,l.y+l.height/2);tick(1/60);assert(!snap().input.throttle&&!snap().input.reverse&&!snap().input.drift,'레일 진입 시 중립 실패');emit(gas(),'pointermove',2,l.x+l.width/2,l.y+l.height/2+40);tick(1/60);assert(snap().input.drift,'가속→레일 드리프트 실패');const g=box(gas());emit(gas(),'pointermove',2,g.x+g.width/2,g.y+g.height/2);tick(1/60);assert(snap().input.throttle&&!snap().input.drift,'레일→가속 해제 실패');emit(gas(),'pointerup',2);tick(1/60);neutral();});
  for(const type of ['pointerup','pointercancel','lostpointercapture'])record(car+' '+type,()=>{emit(steer(),'pointerdown',1);emit(gas(),'pointerdown',2);emit(steer(),type,1);emit(gas(),type,2);tick(1/60);neutral();leverDown();leverMove(2,-45);emit(lever(),type,2);tick(1/60);neutral();});
  record(car+' pause, map, resize and steering mode clear',()=>{for(const action of [()=>click('#pause'),()=>click('#map-open'),()=>w().dispatchEvent(new (w().Event)('resize')),()=>change('#pause-steering-mode','buttons')]){emit(steer(),'pointerdown',1);leverDown();leverMove(2,45);action();tick(1/60);neutral();if(!q('#course-map').hidden)click('#map-resume');else if(snap().mode==='paused')click('#resume');change('#pause-steering-mode','slide');}});
  record(car+' neutral zone and lever ownership',()=>{leverDown();leverMove(2,3);tick(1/60);assert(!snap().input.reverse&&!snap().input.drift,'작은 움직임 오작동');emit(lever(),'pointerdown',4);leverMove(4,-45);tick(1/60);assert(snap().driveConsole.owner===2&&!snap().input.reverse,'다른 손가락이 레버 탈취');emit(lever(),'pointerup',4);leverMove(2,-45);tick(1/60);assert(snap().input.reverse,'소유 손가락 입력 실패');releaseAll();neutral();});
  record(car+' focused lever and existing keyboard',()=>{for(const [key,command]of [['ArrowUp','reverse'],['ArrowDown','drift']]){lever().dispatchEvent(new (w().KeyboardEvent)('keydown',{bubbles:true,cancelable:true,key,code:key}));tick(1/60);assert(snap().input[command]&&!snap().input.throttle,'레버 키보드 실패');lever().dispatchEvent(new (w().KeyboardEvent)('keyup',{bubbles:true,key,code:key}));tick(1/60);neutral();}d().body.dispatchEvent(new (w().KeyboardEvent)('keydown',{bubbles:true,code:'KeyX',key:'x'}));tick(1/60);assert(snap().input.reverse,'기존 X 후진 실패');d().body.dispatchEvent(new (w().KeyboardEvent)('keyup',{bubbles:true,code:'KeyX',key:'x'}));tick(1/60);neutral();});
  record(car+' blur clears both thumbs',()=>{emit(steer(),'pointerdown',1);leverDown();leverMove(2,45);w().dispatchEvent(new (w().Event)('blur'));tick(1/60);neutral();assert(snap().mode==='paused','창 이탈 일시정지 실패');click('#resume');});
  record(car+' save fields preserved',()=>{const after=JSON.parse(w().localStorage.getItem('hojin-city-gp:save:v1'));for(const field of ['coins','races','best','courseBest','owned','garage'])assert(JSON.stringify(after[field])===JSON.stringify(saved[field]),'기록 변경 '+field);assert(after.coins===saved.coins&&after.races===saved.races,'기존 기록 손실');return{coins:after.coins,races:after.races,owned:after.owned.length};});
  await finishCheck(car);
 }
 report.runtimeErrors=w().__cockpitReviewErrors;report.passed=report.checks.every(c=>c.passed)&&!report.runtimeErrors.length;$('#status').textContent=(report.passed?'통과 ':'실패 ')+report.checks.filter(c=>c.passed).length+'/'+report.checks.length;
 }catch(e){report.error=e.stack;$('#status').textContent='중단 '+e.message;}finally{$('#report').textContent=JSON.stringify(report,null,2);$('#run').disabled=false;}
}
$('#run').onclick=run;$('#show').onclick=async()=>{await init();await size(844,390);start();qa().reviewScene({progress:.34});qa().advance(0,null);$('#status').textContent='본게임 운전석 · 저장 격리';};$('#capture').onclick=()=>document.body.classList.toggle('capture');addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('capture');});
</script>
