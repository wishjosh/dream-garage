<!doctype html><meta charset="utf-8"><title>조작부 비교 검증</title><style>body{background:#152019;color:#eef;font:14px system-ui}button{padding:12px}iframe{display:block;border:0}pre{white-space:pre-wrap}</style><h1>조작 방식·경주 디자인 검증</h1><button id="run">전체 검사</button><strong id="status">대기</strong><iframe id="game" width="844" height="390"></iframe><pre id="report"></pre><script type="module">
const frame=document.querySelector('#game'),out=document.querySelector('#report'),status=document.querySelector('#status'),w=()=>frame.contentWindow,d=()=>frame.contentDocument,q=s=>d().querySelector(s),qa=()=>w().__raceQA,ctl=()=>w().__controlsHudStudy,snap=()=>qa().snapshot(),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const gtOnly=new URLSearchParams(location.search).get('variant')==='gt';const visualVariants=gtOnly?['gt']:['classic','minimal','precision','sport','digital','gt'];
let report={checks:[]};const assert=(v,m)=>{if(!v)throw Error(m)};
function record(name,fn){try{report.checks.push({name,passed:true,evidence:fn()})}catch(e){report.checks.push({name,passed:false,error:e.message})}out.textContent=JSON.stringify(report,null,2)}
function box(el){const r=el.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom}}
function stub(){for(const el of d().querySelectorAll('[data-drive-target],#thumb-steering')){el.setPointerCapture=()=>{};el.releasePointerCapture=()=>{};el.hasPointerCapture=()=>false}}
function emit(el,type,id=2,amount=.5,x,y){const r=box(el);el.dispatchEvent(new (w().PointerEvent)(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:id===1,button:0,buttons:['pointerup','pointercancel'].includes(type)?0:1,clientX:x??r.x+r.width/2,clientY:y??r.bottom-12-amount*(r.height-24)}))}
const gas=()=>q('[data-control=throttle]'),brake=()=>q('[data-control=brake]'),steer=()=>q('#thumb-steering');
const tick=t=>qa().advance(t,null),neutral=()=>{const s=snap();assert(!Object.values(s.input).some(Boolean)&&s.controlsStudy.pointers===0&&s.driveConsole.active===0&&!s.steeringControl.active,'입력 잔류')};
function scene(variant='precision',view='cockpit'){ctl().setScene(view);ctl().setVariant(variant);stub();tick(0)}
function layout(){q('#speed').textContent='288';q('#gear').textContent='6';const gt=d().body.dataset.controlsDesign==='gt';q('#gt-speed').textContent='288';q('#gt-gear').textContent='6';const selectors=gt?['#thumb-steering','[data-control=throttle]','[data-control=brake]','#drive-lever','#rescue','.gt-instrument','#gt-map','.gt-position','.gt-timing','.top-actions','#city-look']:['#thumb-steering','[data-control=throttle]','[data-control=brake]','#drive-lever','#rescue','#speedometer','#map-open','.race-stats','.top-actions'];if(d().body.dataset.controlsDesign==='precision')selectors.push('#study-inputs');const rs=selectors.map(s=>({s,...box(q(s))}));for(const r of rs){assert(r.x>=-.5&&r.y>=-.5&&r.right<=w().innerWidth+.5&&r.bottom<=w().innerHeight+.5,'화면 밖 '+r.s+JSON.stringify(r));if(selectors.indexOf(r.s)<5){assert(r.width>=44&&r.height>=44,'44px 미만 '+r.s);const el=q(r.s),hit=d().elementFromPoint(r.x+r.width/2,r.y+r.height/2);assert(hit===el||el.contains(hit),'가림 '+r.s)}}for(let i=0;i<rs.length;i++)for(let j=i+1;j<rs.length;j++){const a=rs[i],b=rs[j];assert(!(a.x<b.right-.5&&b.x<a.right-.5&&a.y<b.bottom-.5&&b.y<a.bottom-.5),'겹침 '+a.s+'/'+b.s)}if(gt&&w().innerHeight>w().innerWidth&&snap().view==='cockpit'){const b=snap().mirrorStats.bounds,m={x:b.x*w().innerWidth,y:b.y*w().innerHeight,right:(b.x+b.width)*w().innerWidth,bottom:(b.y+b.height)*w().innerHeight};for(const a of rs)assert(!(a.x<m.right-.5&&m.x<a.right-.5&&a.y<m.bottom-.5&&m.y<a.bottom-.5),'후방 거울 겹침 '+a.s)}const speed=box(q(gt?'.gt-instrument':'#speedometer'));for(const sel of gt?['#gt-speed','#gt-gear']:['#speed','#gear']){const t=box(q(sel));assert(t.x>=speed.x&&t.right<=speed.right+.5,'숫자 넘침 '+sel)}return{size:[w().innerWidth,w().innerHeight],allInside:true,noOverlap:true}}
document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;report={checks:[],method:'actual isolated game, synthetic touch and deterministic physics'};try{
frame.src='/?course=braking&study=controls-hud&qa=1&review=1';
for(let i=0;i<900;i++){if(ctl())break;await sleep(50)}assert(ctl(),'준비 실패');w().__cockpitReviewSetFrozen(true);await sleep(150);
for(const [width,height]of [[844,390],[568,320],[402,874],[320,568]])for(const variant of visualVariants)for(const view of ['cockpit','chase']){frame.width=width;frame.height=height;await sleep(80);scene(variant,view);status.textContent=width+'×'+height+' '+variant+' '+view;record(status.textContent,layout)}
frame.width=844;frame.height=390;await sleep(80);
for(const variant of visualVariants){
scene(variant);record(variant+' 가속·제동·조향',()=>{emit(gas(),'pointerdown',2,.5);const r=box(steer());emit(steer(),'pointerdown',1);emit(steer(),'pointermove',1,.5,r.x+r.width/2-18);tick(.5);const s=snap();assert(Math.abs(Number(s.input.throttle)-(['precision','sport','digital'].includes(variant)?.5:1))<.01,'가속량');assert(s.steeringControl.value>0&&s.player.speed>0,'동시 조향 주행');if(variant==='precision'){const face=q('.gas-face'),fill=parseFloat(w().getComputedStyle(face,'::before').height),expected=(face.clientHeight-24)*.5;assert(Math.abs(fill-expected)<1,'입력량 막대 불일치')}emit(gas(),'pointermove',2,.5,box(brake()).x+box(brake()).width/2,box(brake()).y+box(brake()).height/2);tick(.1);assert(Number(snap().input.brake)>0&&!snap().input.throttle,'제동 전환');emit(gas(),'pointerup');emit(steer(),'pointerup',1);tick(1/60);neutral();return{input:s.input.throttle,speed:s.player.speed,steer:s.steeringControl.value}});
scene(variant);record(variant+' 주행 후 차고 복귀',()=>{emit(gas(),'pointerdown',2,.8);tick(1);emit(gas(),'pointerup');q('#pause').click();assert(snap().mode==='paused','일시정지');q('#back-menu').click();assert(snap().mode==='menu'&&snap().screen==='garage','차고 복귀');neutral();assert(w().localStorage.length===0,'일반 저장 쓰기');return{screen:snap().screen,localStorageWrites:0}});
}
const acceleration=[];for(const amount of [.25,.75]){scene();emit(gas(),'pointerdown',2,amount);tick(.8);acceleration.push({amount,input:snap().input.throttle,speed:snap().player.speed});emit(gas(),'pointerup')}record('부분 가속이 실제 속도에 반영',()=>{assert(acceleration[1].speed>acceleration[0].speed+1,'가속 차이 없음');return acceleration});
const braking=[];for(const amount of [.25,.75]){scene();qa().advance(.9,{throttle:1});emit(brake(),'pointerdown',2,amount);tick(.3);braking.push({amount,input:snap().input.brake,speed:snap().player.speed});emit(brake(),'pointerup')}record('부분 제동이 실제 속도에 반영',()=>{assert(braking[0].speed>braking[1].speed+.1,'제동 차이 없음');return braking});
for(const type of ['pointerup','pointercancel','lostpointercapture']){scene();record(type+' 해제',()=>{emit(gas(),'pointerdown',2,.8);tick(1/60);emit(gas(),type);tick(1/60);neutral()})}
for(const action of ['pause','resize','blur','variant','scene']){scene();record(action+' 해제',()=>{emit(gas(),'pointerdown',2,.8);tick(1/60);if(action==='pause')q('#pause').click();if(action==='resize'||action==='blur')w().dispatchEvent(new (w().Event)(action));if(action==='variant')ctl().setVariant('classic');if(action==='scene')ctl().setScene('cockpit');tick(1/60);neutral()})}
scene();record('화면 밖 드래그 해제 및 재진입',()=>{emit(gas(),'pointerdown',2,.8);emit(gas(),'pointermove',2,.8,-20);tick(1/60);assert(!snap().input.throttle,'화면 밖 가속');emit(gas(),'pointermove',2,.3);tick(1/60);assert(Math.abs(snap().input.throttle-.3)<.01,'재진입 입력량');emit(gas(),'pointerup');tick(1/60);neutral()});

for(const variant of (gtOnly?[]:['sport','digital'])){
 const results=[];
 for(const amount of [.25,.75]){scene(variant);emit(gas(),'pointerdown',2,amount);tick(.8);results.push({amount,input:snap().input.throttle,speed:snap().player.speed});emit(gas(),'pointerup')}
 record(variant+' 부분 가속',()=>{assert(results[1].speed>results[0].speed+1,'가속 차이 없음');return results});
 const stops=[];
 for(const amount of [.25,.75]){scene(variant);qa().advance(.9,{throttle:1});emit(brake(),'pointerdown',2,amount);tick(.3);stops.push({amount,input:snap().input.brake,speed:snap().player.speed});emit(brake(),'pointerup')}
 record(variant+' 부분 제동',()=>{assert(stops[0].speed>stops[1].speed+.1,'제동 차이 없음');return stops});
 for(const type of ['pointerup','pointercancel','lostpointercapture']){scene(variant);record(variant+' '+type,()=>{emit(gas(),'pointerdown',2,.8);tick(1/60);emit(gas(),type);tick(1/60);neutral()})}
 for(const action of ['pause','resize','blur','variant','scene']){scene(variant);record(variant+' '+action,()=>{emit(gas(),'pointerdown',2,.8);tick(1/60);if(action==='pause')q('#pause').click();if(action==='resize'||action==='blur')w().dispatchEvent(new (w().Event)(action));if(action==='variant')ctl().setVariant(variant==='sport'?'digital':'sport');if(action==='scene')ctl().setScene('cockpit');tick(1/60);neutral()})}
 scene(variant);record(variant+' 페달 안 표시·중앙 시야',()=>{emit(gas(),'pointerdown',2,.5);tick(1/60);assert(q('.gas-face .pedal-meter b').textContent==='50','페달 표시');assert(w().getComputedStyle(q('#study-inputs')).display==='none','중앙 정보 상자');const face=q('.gas-face'),fill=parseFloat(w().getComputedStyle(face,'::before').height);assert(Math.abs(fill-(face.clientHeight-24)*.5)<1,'막대 높이');emit(gas(),'pointerup');tick(1/60);assert(q('.gas-face .pedal-meter b').textContent==='0','표시 해제');neutral()});
}

scene('gt');record('GT 실제 주행 정보와 코스 지도',()=>{qa().advance(2,{throttle:.7});const s=snap();assert(q('#gt-speed').textContent===q('#speed').textContent,'속도 불일치');assert(q('#gt-gear').textContent===q('#gear').textContent,'기어 불일치');assert(q('#gt-time').textContent===q('#time').textContent,'시간 불일치');assert(q('#gt-course').textContent==='브레이크 루프','코스명');assert(q('#gt-map-cars').children.length===s.racers.length,'차량 수');assert(q('.gt-map-line').getAttribute('d').length>100,'실제 코스 경로');assert(Number(q('#gt-progress').textContent.replace('%',''))===Math.floor(s.player.distance/s.length*100),'진행률');return{speed:q('#gt-speed').textContent,elapsed:s.elapsed,mapCars:s.racers.length}});
for(const variant of ['gt','digital']) {
  scene(variant);
  ctl().setVariant(variant,true);
  record(variant+' 페달 위치 무관·입력 해제',()=>{
    for(const [pedal,key] of [[gas(),'throttle'],[brake(),'brake']]) {
      emit(pedal,'pointerdown',2,.1);tick(1/60);
      assert(snap().input[key]===true,'페달 아래 입력');
      emit(pedal,'pointermove',2,.9);tick(1/60);
      assert(snap().input[key]===true,'페달 위 입력');
      assert(w().getComputedStyle(q('.gas-face .pedal-meter')).display==='none','입력량 표시 잔류');
      emit(pedal,'pointercancel');tick(1/60);neutral();
    }
  });
}
scene('gt');record('GT 지도 열기·주행 복귀',()=>{q('#gt-map').click();assert(snap().mode==='paused'&&!q('#course-map').hidden,'지도 열기');q('#map-resume').click();assert(snap().mode==='race'&&q('#course-map').hidden,'지도 복귀');neutral()});
report.runtimeErrors=w().__cockpitReviewErrors;report.passed=report.checks.every(c=>c.passed)&&!report.runtimeErrors.length;status.textContent=(report.passed?'통과 ':'실패 ')+report.checks.filter(c=>c.passed).length+'/'+report.checks.length;
}catch(e){report.error=e.stack;status.textContent='중단 '+e.message}finally{out.textContent=JSON.stringify(report,null,2);document.querySelector('#run').disabled=false}};
</script>
