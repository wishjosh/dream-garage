<!doctype html><html lang="ko"><meta charset="utf-8"><title>코스 본게임 연동 검사</title><style>body{margin:12px;background:#10202c;color:#dbeee7;font:14px system-ui}button{padding:10px;margin:4px}iframe{display:block;border:0}pre{white-space:pre-wrap}.viewport-only header,.viewport-only #report{display:none}.viewport-only #game{position:fixed;inset:0;width:100%;height:100%}</style><header><button id="run">코스·상금·저장 검사</button><button id="viewport">실제 화면 크기</button><button id="chooser">코스 선택 보기</button><strong id="status">준비</strong></header><iframe id="game" width="874" height="402"></iframe><pre id="report"></pre><script id="state" type="application/json">{}</script><script type="module">
const $=s=>document.querySelector(s),frame=$('#game'),w=()=>frame.contentWindow,d=()=>frame.contentDocument,q=s=>d().querySelector(s),qa=()=>w().__raceQA,snap=()=>qa().snapshot(),sleep=ms=>new Promise(r=>setTimeout(r,ms)),KEY='hojin-city-gp:save:v1',original=localStorage.getItem(KEY),checks=[];
const stored=()=>JSON.parse(w().localStorage.getItem(KEY)),click=s=>q(s).click();let state='ready';
function report(){const result={status:state,checks,snapshot:qa()?.snapshot(),stored:qa()?stored():null,errors:w().__cockpitReviewErrors||[],realStorageUnchanged:localStorage.getItem(KEY)===original};$('#state').textContent=JSON.stringify(result);$('#report').textContent=checks.map(c=>(c.ok?'PASS ':'FAIL ')+c.name).join('\n');}
function check(name,ok,detail){checks.push({name,ok,detail});report();if(!ok)throw Error(name);}
async function ready(){for(let i=0;i<1000;i++){await sleep(40);try{if(qa()&&!q('#enter-garage').disabled){w().__cockpitReviewSetFrozen(true);return;}}catch{}}throw Error('load timeout');}
async function load(){frame.src='/?qa=1&review=1&handling-save=1&review-persist=1&course=tour&v=courses-main-1';await new Promise(r=>frame.addEventListener('load',r,{once:true}));await ready();}
function garage(){const s=snap();if(['countdown','race'].includes(s.mode))click('#pause');if(snap().mode==='paused')click('#back-menu');if(snap().mode==='result')click('#result-menu');if(snap().screen==='welcome')click('#enter-garage');}
async function choose(key){garage();click('#course-open');click('[data-race-course="'+key+'"]');const next=new Promise(r=>frame.addEventListener('load',r,{once:true}));click('#course-apply');await next;await ready();}
async function run(){state='running';checks.length=0;$('#status').textContent='검사 중';await load();garage();const initial=stored();
 check('old wallet, records and Ferrari equipment resume',initial.coins===4321&&initial.races===12&&initial.best.tavaculo===29.5&&initial.garage.tavaculo.paint==='paint-mint');
 check('old URL defaults to the existing tour',snap().courseId==='bayfront-long-1');const untouched=w().localStorage.getItem(KEY);click('#course-open');check('all four routes are selectable',d().querySelectorAll('[data-race-course]').length===4);click('[data-race-course="speed"]');click('#course-dialog-close');check('cancelled choice changes neither save nor current route',w().localStorage.getItem(KEY)===untouched&&snap().courseId==='bayfront-long-1');
 click('[data-item="paint-blue"]');check('pending paint keeps departure and course selection hidden',q('#launch-actions').hidden&&snap().shopPreview.id==='paint-blue');click('#shop-cancel');
 for(const [key,id,car] of [['speed','beginner-speed-1','tavaculo'],['rhythm','beginner-rhythm-1','porsche'],['braking','beginner-braking-1','tavaculo'],['tour','bayfront-long-1','f2002']]){
  const prior=stored();await choose(key);check(key+' opens directly into garage and retains progress',snap().screen==='garage'&&snap().courseId===id&&stored().coins===prior.coins&&JSON.stringify(stored().best)===JSON.stringify(prior.best)&&Object.entries(prior.garage).every(([car,slot])=>JSON.stringify(stored().garage[car])===JSON.stringify(slot)));
  click('[data-car="'+car+'"]');const before=stored();click('#start');qa().advance(3.6,{});qa().setAssist(true);
  check(key+' keeps the selected car class',snap().racers.every(r=>car==='f2002'?r.car==='f2002':r.car!=='f2002'));
  for(let sec=0;sec<200&&snap().mode!=='result';sec+=3){qa().advanceDriver(3);$('#status').textContent=key+' 완주 '+sec+'초';await sleep(5);}
  const after=stored();check(key+' completes and pays exactly one current prize',snap().mode==='result'&&after.races===before.races+1&&[1000,650,400,150].includes(after.coins-before.coins),{delta:after.coins-before.coins,elapsed:snap().elapsed});
  check(key+' writes only its own record and preserves equipment',Number.isFinite(after.courseBest?.[id]?.[car])&&JSON.stringify(after.garage)===JSON.stringify(before.garage)&&JSON.stringify(after.owned)===JSON.stringify(before.owned)&&JSON.stringify(after.best)===JSON.stringify(before.best));
  for(const [other,times] of Object.entries(before.courseBest||{}))if(other!==id)check(key+' preserves '+other,JSON.stringify(after.courseBest[other])===JSON.stringify(times));
  qa().advanceDriver(3);check(key+' result cannot pay twice',stored().coins===after.coins&&stored().races===after.races);check(key+' finish names the selected route',q('#result-course-name').textContent.includes(snap().courseId==='bayfront-long-1'?'시티 투어':key==='speed'?'루프':key==='rhythm'?'플로우':'마리나'));check(key+' no runtime errors',w().__cockpitReviewErrors.length===0,w().__cockpitReviewErrors);
 }
 const earned=stored();await load();garage();check('all four route records survive reopening',JSON.stringify(stored())===JSON.stringify(earned));
 const {createTransfer,parseTransfer}=await import('/save-transfer.mjs?v=courses-main-1');check('export/import round trip retains every route and purchase',JSON.stringify(parseTransfer(createTransfer(earned)).save)===JSON.stringify(earned));
 click('[data-item="paint-blue"]');click('#shop-confirm');check('purchase still charges one existing price',stored().coins===earned.coins-250&&stored().garage.f2002.paint==='paint-blue');const paid=stored().coins;click('[data-item="paint-stock"]');click('#shop-confirm');click('[data-item="paint-blue"]');click('#shop-confirm');check('owned paint re-equips for free',stored().coins===paid);
 check('real browser storage was never written',localStorage.getItem(KEY)===original);state='complete';$('#status').textContent='전체 검사 통과';report();
}
$('#run').onclick=()=>run().catch(e=>{state='failed';$('#status').textContent=e.message;report();});$('#viewport').onclick=()=>{document.body.classList.toggle('viewport-only');frame.width=innerWidth;frame.height=innerHeight;};$('#chooser').onclick=()=>{garage();click('#course-open');report();};
await load();report();
</script></html>
