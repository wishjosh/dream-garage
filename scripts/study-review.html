<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>운전석 공간 시안 · 로컬 검사</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#101c24;color:#e8f0ef;font:14px/1.5 system-ui,sans-serif}h1{font-size:22px;margin:0 0 8px}p{max-width:1050px}button,select{font:inherit;padding:10px 12px;border:1px solid #698178;border-radius:8px;background:#243b3c;color:inherit;min-height:44px}button{cursor:pointer}button:disabled{opacity:.5}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}#run-study{background:#92dec2;color:#132f28;font-weight:700}.note{padding:10px 14px;border-left:4px solid #e5bb71;background:#273438}#study-status{padding:8px 12px;border-radius:8px;background:#263f43}#study-status[data-state=passed]{background:#1e6147}#study-status[data-state=failed]{background:#703b3e}#stage{max-width:100%;overflow:auto;padding:8px;background:#02080c}#wrap{position:relative}iframe{display:block;border:0;transform-origin:top left;background:#b9c5cd}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px;background:#09141b;max-height:560px;overflow:auto;font-size:12px}.pass{color:#9ae0c1}.fail{color:#ffb9ad}.capture-only{margin:0;padding:0;overflow:hidden}.capture-only header,.capture-only .toolbar,.capture-only #results,.capture-only details{display:none}.capture-only #stage{margin:0;padding:0;overflow:hidden}.capture-only #study-frame{position:fixed;left:0;top:0;transform:none!important;z-index:9999}
</style></head><body>
<header><h1>운전석 공간 시안 · 로컬 검사</h1><p class="note">실제 시안의 QA API로 좌석·시선·화면 크기와 정해진 이동 시점을 검사합니다. 실제 조작 요소에 합성 포인터·키 이벤트를 보내 입력과 시선 복귀도 확인합니다. 이 검사는 네이티브 포인터 캡처, 실제 스마트폰의 손 조작·성능, 공간감의 시각적 품질 확인을 대신하지 않습니다. 게임 저장은 사용하지 않으며 결과 파일을 자동 저장하지 않습니다.</p></header>
<div class="toolbar"><button id="run-study">공간 시안 검사 시작</button><span id="study-status" role="status" data-state="idle">실행 대기</span></div>
<div class="toolbar"><label>화면 <select id="view-size"><option>844x390</option><option>568x320</option><option>390x844</option><option>320x568</option></select></label><label>장면 <select id="view-pose"><option value="forward">앞 보기</option><option value="left">왼쪽</option><option value="right">오른쪽</option><option value="low">낮은 좌석</option><option value="high">높은 좌석</option><option value="front">좌석 앞으로</option><option value="back">좌석 뒤로</option><option value="wide">넓은 시야</option><option value="narrow">좁은 시야</option><option value="steering-left">왼쪽 조향 · 시선 연동</option><option value="steering-right">오른쪽 조향 · 시선 연동</option></select></label><button id="show-study">선택 장면 보기</button><button id="capture-study">게임 화면만 보기</button><label><input id="fit" type="checkbox" checked>화면에 맞춤</label><small>화면만 보기에서 Esc로 돌아옵니다.</small></div>
<div id="stage"><div id="wrap"><iframe id="study-frame" title="실제 운전석 공간 시안" width="844" height="390" src="about:blank"></iframe></div></div>
<section id="results"><ol id="study-results"></ol><p id="study-error" role="alert"></p></section>
<details open><summary>검사 결과 JSON</summary><pre id="study-report-json">아직 실행하지 않았습니다.</pre></details>
<script>
'use strict';
const $=id=>document.getElementById(id),frame=$('study-frame'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let size=[844,390],busy=false,deadline=Infinity,report=null,defaults=null;
const win=()=>frame.contentWindow,api=()=>win().__cockpitStudy;
const assert=(condition,message)=>{if(!condition)throw Error(message);};
const near=(a,b,tolerance=1e-5)=>Math.abs(a-b)<=tolerance;
const status=(text,state='running')=>{$('study-status').textContent=text;$('study-status').dataset.state=state;};
const publish=()=>{$('study-report-json').textContent=JSON.stringify(report,null,2);};
function fit(){const scale=$('fit').checked?Math.min(1,Math.max(1,$('stage').clientWidth-16)/size[0]):1;frame.style.transform=`scale(${scale})`;$('wrap').style.width=size[0]*scale+'px';$('wrap').style.height=size[1]*scale+'px';}
function resize(width,height){size=[width,height];frame.width=width;frame.height=height;frame.style.width=width+'px';frame.style.height=height+'px';fit();}
function lock(value){busy=value;for(const id of ['run-study','show-study','view-size','view-pose'])$(id).disabled=value;}
async function settle(){await sleep(65);assert(performance.now()<deadline,'검사 시간이 45초를 넘었습니다.');win().dispatchEvent(new (win().Event)('resize'));return api().runChecks();}
async function load(){
 let ready=false;try{ready=api()?.snapshot().ready===true;}catch{}
 if(!ready){
  const nonce=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);frame.src='../cockpit-study.html?review=1&run='+nonce;
  const until=Math.min(deadline,performance.now()+30000);
  while(performance.now()<until){
   let same=false;try{same=new URL(win().location.href).searchParams.get('run')===nonce;}catch{}
   if(same&&api()){
    const snapshot=api().snapshot();if(snapshot.ready){ready=true;break;}
    if(['missing','error'].includes(snapshot.asset))throw Error(snapshot.error||'실제 차량 모델을 준비하지 못했습니다.');
   }
   await sleep(40);
  }
  assert(ready,'실제 차량 모델 로딩 시간 초과');
 }
 assert(typeof api().reviewAt==='function','__cockpitStudy.reviewAt(seconds)가 필요합니다.');
 assert(typeof api().reviewSteering==='function'&&typeof api().clearSteering==='function','실제 조향 검사 API가 필요합니다.');
 api().pause();api().resetMotion();api().resetCamera();api().setToolsVisible(false);api().clearSteering(true);setFollow(true);defaults={...api().snapshot().settings};
 for(const [id,key,lower,upper] of [['eye-height','height','low','high'],['eye-depth','foreAft','back','front'],['lens-fov','verticalFov','narrow','wide'],['gaze-pitch','pitch','down','up']]){const control=frame.contentDocument.getElementById(id);assert(control,'시안 조절 요소 없음: '+id);poses[lower]={[key]:Number(control.min)};poses[upper]={[key]:Number(control.max)};}
 return api().runChecks();
}
function fixed(snapshot){assert(snapshot.ready,'실제 모델 준비 상태가 아닙니다.');assert(snapshot.model.meshes>0&&snapshot.model.triangles>0,'차량 geometry가 없습니다.');assert(snapshot.model.nonFinite===0,'유효하지 않은 모델 변환');assert(snapshot.invariant.available&&snapshot.invariant.passed,'포즈/화면 변경으로 부품 geometry 또는 상대 변환이 달라졌습니다.');}
function capture(snapshot){return{viewport:snapshot.viewport,model:snapshot.model,camera:snapshot.camera,settings:snapshot.settings,motion:snapshot.motion,steering:snapshot.steering,invariant:snapshot.invariant};}
function add(name,snapshot){fixed(snapshot);report.checks.push({name,passed:true,evidence:capture(snapshot)});const li=document.createElement('li');li.className='pass';li.textContent='통과 · '+name;$('study-results').append(li);publish();}
const poses={forward:{glance:'forward'},left:{glance:'left'},right:{glance:'right'},low:{height:-.07},high:{height:.06},front:{foreAft:.08},back:{foreAft:-.10},wide:{verticalFov:65},narrow:{verticalFov:30},down:{pitch:-9},up:{pitch:3}};
function pose(values){api().clearSteering(true);api().setPose({...defaults,...values});return api().runChecks();}
function inputPose(name){api().setPose({...defaults});const [key,value]=Object.entries(poses[name])[0];if(key==='glance')frame.contentDocument.querySelector(`[data-glance="${value}"]`).click();else{const ids={height:'eye-height',foreAft:'eye-depth',verticalFov:'lens-fov',pitch:'gaze-pitch'},element=frame.contentDocument.getElementById(ids[key]);element.value=String(value);element.dispatchEvent(new (win().Event)('input',{bubbles:true}));}const s=api().runChecks();assert(typeof value==='string'?s.settings[key]===value:near(s.settings[key],value),'조절 UI 연결 오류: '+name);return s;}

let pointerSerial=100;
function setFollow(checked){const input=frame.contentDocument.getElementById('steering-follow');assert(input,'시선 따라가기 입력 없음');input.checked=checked;input.dispatchEvent(new (win().Event)('change',{bubbles:true}));}
function pointer(button,type,id,primary=true){
 const rect=button.getBoundingClientRect();
 button.dispatchEvent(new (win().PointerEvent)(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',isPrimary:primary,button:0,buttons:type==='pointerdown'?1:0,clientX:rect.left+rect.width/2,clientY:rect.top+rect.height/2}));
}
function key(type,code,target=frame.contentDocument.body){target.dispatchEvent(new (win().KeyboardEvent)(type,{bubbles:true,cancelable:true,code,key:{ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',KeyA:'a',KeyD:'d'}[code]||code}));}
function steeringStart(){api().clearSteering(true);api().resetMotion();api().setPose({...defaults});api().setToolsVisible(false);setFollow(true);return api().snapshot();}
function stableView(snapshot,base){
 fixed(snapshot);assert(snapshot.steering?.rotationValid,'실제 핸들 회전축 검증 실패');assert(snapshot.steering.pivot,'실제 핸들 피벗 없음');
 assert(snapshot.camera.eyeLocal.every((value,index)=>near(value,base.camera.eyeLocal[index])),'조향으로 눈 위치 변경');
 assert(near(snapshot.camera.verticalFov,base.camera.verticalFov),'조향으로 시야각 변경');
 assert(Math.abs(snapshot.steering.lookDegrees)<=6+1e-5,'시선 연동 6도 상한 초과');
}
function turned(snapshot,direction,base){
 stableView(snapshot,base);assert(snapshot.steering.target===direction,'입력 방향 불일치');assert(snapshot.steering.amount*direction>.99,'핸들 조향 반영 부족');assert(snapshot.steering.wheelDegrees*direction>108,'핸들 회전 부족');
 assert(snapshot.steering.lookDegrees*direction>5.8,'시선 연동 방향 또는 크기 오류');assert(snapshot.camera.direction[0]*direction>.09,'실제 카메라 좌우 방향 오류');
}
function centred(snapshot,base){stableView(snapshot,base);assert(snapshot.steering.target===0,'조향 입력이 남아 있습니다.');assert(Math.abs(snapshot.steering.amount)<.00001,'핸들 중립 복귀 실패');assert(Math.abs(snapshot.steering.lookDegrees)<.005,'시선 정면 복귀 실패');assert(Math.abs(snapshot.camera.direction[0])<.0001,'카메라 정면 복귀 실패');}
function pressed(button,value){assert(button.getAttribute('aria-pressed')===String(value),'버튼 누름 표시 불일치: '+button.id);}
async function steeringChecks(){
 const left=frame.contentDocument.getElementById('steer-left'),right=frame.contentDocument.getElementById('steer-right');assert(left&&right,'좌우 조향 버튼 없음');
 for(const [direction,button,label] of [[-1,left,'왼쪽'],[1,right,'오른쪽']]){
  const base=steeringStart(),id=++pointerSerial;pointer(button,'pointerdown',id);pressed(button,true);const held=api().reviewSteering(1.4);turned(held,direction,base);add(label+' 포인터 누름 · 핸들/시선 동시 반응',held);
  pointer(button,'pointerup',id);pressed(button,false);const released=api().reviewSteering(2.5);centred(released,base);add(label+' 포인터 해제 · 정면 복귀',released);
 }
 for(const event of ['pointercancel','lostpointercapture']){
  const base=steeringStart(),id=++pointerSerial;pointer(left,'pointerdown',id);api().reviewSteering(1);pointer(left,event,id);pressed(left,false);const s=api().reviewSteering(2.5);centred(s,base);add(event+' · 입력 취소와 복귀',s);
 }
 {
  const base=steeringStart(),l=++pointerSerial,r=++pointerSerial;pointer(left,'pointerdown',l);pointer(right,'pointerdown',r,false);pressed(left,true);pressed(right,true);
  const balanced=api().reviewSteering(1);centred(balanced,base);add('양방향 동시 포인터 · 중립 유지',balanced);
  pointer(left,'pointerup',l);pressed(left,false);pressed(right,true);const remaining=api().reviewSteering(1.4);turned(remaining,1,base);add('한 포인터 해제 · 남은 오른쪽 입력 유지',remaining);
  pointer(right,'pointerup',r,false);const released=api().reviewSteering(2.5);centred(released,base);add('두 포인터 모두 해제 · 정면 복귀',released);
 }
 for(const [code,direction] of [['KeyA',-1],['KeyD',1],['ArrowLeft',-1],['ArrowRight',1]]){
  const base=steeringStart();key('keydown',code);const held=api().reviewSteering(1.4);turned(held,direction,base);add(code+' 키 누름 · 방향 연동',held);
  key('keyup',code);const released=api().reviewSteering(2.5);centred(released,base);add(code+' 키 해제 · 정면 복귀',released);
 }
 {
  const base=steeringStart(),id=++pointerSerial;pointer(left,'pointerdown',id);key('keydown','KeyA');api().reviewSteering(.5);pointer(left,'pointerup',id);pressed(left,true);
  const s=api().reviewSteering(1);turned(s,-1,base);add('같은 방향 포인터 해제 후 키 입력 유지',s);key('keyup','KeyA');api().clearSteering(true);
 }
 for(const event of ['blur','resize']){
  const base=steeringStart(),id=++pointerSerial;pointer(right,'pointerdown',id);api().reviewSteering(1);win().dispatchEvent(new (win().Event)(event));
  const s=api().runChecks();centred(s,base);pressed(left,false);pressed(right,false);add(event+' · 조향 즉시 해제',s);
 }
 {
  const base=steeringStart(),id=++pointerSerial;pointer(left,'pointerdown',id);api().reviewSteering(1.4);setFollow(false);
  const off=api().reviewSteering(2.5);stableView(off,base);assert(!off.steering.follow&&off.steering.target===-1,'시선 연동 끄기 반영 실패');assert(off.steering.amount<-.99,'연동 끄기가 핸들까지 멈춤');assert(Math.abs(off.steering.lookDegrees)<.005&&Math.abs(off.camera.direction[0])<.0001,'시선 연동을 꺼도 카메라가 돌아가지 않음');add('시선 연동 끄기 · 핸들만 회전',off);
  setFollow(true);const on=api().reviewSteering(1.4);turned(on,-1,base);assert(on.steering.follow,'시선 연동 켜기 반영 실패');add('시선 연동 다시 켜기',on);pointer(left,'pointerup',id);api().clearSteering(true);
 }
 {
  const base=steeringStart(),id=++pointerSerial;pointer(left,'pointerdown',id);api().reviewSteering(1);frame.contentDocument.getElementById('show-tools').click();
  const s=api().reviewSteering(2.5);centred(s,base);assert(!frame.contentDocument.body.classList.contains('ui-hidden'),'도구 보기 전환 실패');add('도구 열기 · 입력 해제와 시선 복귀',s);
  key('keydown','ArrowLeft');const blocked=api().reviewSteering(1);centred(blocked,base);add('도구를 열면 방향키 조향 중지',blocked);key('keyup','ArrowLeft');api().setToolsVisible(false);
 }

 {
  steeringStart();api().reviewAt(7);const base=api().snapshot(),id=++pointerSerial;pointer(right,'pointerdown',id);const s=api().reviewSteering(1.4);turned(s,1,base);
  assert(near(s.motion.elapsed,7)&&near(s.motion.distance,40)&&near(s.motion.speedKmh,28.8),'조향으로 가속·제동 재생 시점 또는 이동 거리 변경');
  assert(near(s.camera.eyeWorld[0]-s.camera.eyeLocal[0],0)&&near(s.camera.eyeWorld[1]-s.camera.eyeLocal[1],0)&&near(s.camera.eyeWorld[2]-s.camera.eyeLocal[2],-40),'이동 중 조향이 차체 대비 눈 위치를 변경');
  assert(s.camera.eyeWorld.every((value,index)=>near(value,base.camera.eyeWorld[index])),'시선 회전으로 월드 눈 위치 변경');add('7초 이동 위치에서 조향 · 눈 위치와 주행 거리 유지',s);pointer(right,'pointerup',id);api().clearSteering(true);api().resetMotion();
 }

 for(const [width,height] of [[844,390],[568,320],[390,844],[320,568]]){
  resize(width,height);await settle();steeringStart();
  const buttonRects=[left,right].map(button=>{const r=button.getBoundingClientRect();return{id:button.id,left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height};});
  const tool=frame.contentDocument.getElementById('show-tools').getBoundingClientRect();
  const overlaps=(a,b)=>a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top;
  for(const rect of buttonRects){assert(rect.width>=48&&rect.height>=48,'48px 미만 조향 버튼: '+rect.id);assert(rect.left>=0&&rect.top>=0&&rect.right<=width+.5&&rect.bottom<=height+.5,'화면 밖 조향 버튼: '+rect.id);assert(!overlaps(rect,tool),'도구 버튼과 조향 버튼 겹침');const hit=frame.contentDocument.elementFromPoint((rect.left+rect.right)/2,(rect.top+rect.bottom)/2);assert(hit?.closest('[data-steer]')?.id===rect.id,'조향 버튼 중앙이 다른 요소에 가림');}
  assert(!overlaps(...buttonRects),'좌우 조향 버튼 겹침');assert(tool.left>=0&&tool.top>=0&&tool.right<=width+.5&&tool.bottom<=height+.5,'도구 버튼 화면 밖');
  const s=api().runChecks();s.layout={steeringButtons:buttonRects,tool:{left:tool.left,top:tool.top,right:tool.right,bottom:tool.bottom}};add(width+'×'+height+' · 조향 버튼 크기/경계/겹침/판정',s);report.checks.at(-1).evidence.layout=s.layout;publish();
 }
 resize(844,390);await settle();steeringStart();
}

async function run(){
 if(busy)return;lock(true);deadline=performance.now()+45000;report={startedAt:new Date().toISOString(),method:'One actual-model iframe; real DOM controls receive synthetic PointerEvent/KeyboardEvent. Deterministic reviewSteering uses the production dynamics. No native pointer-capture, touch-hardware, phone-performance or immersion claim.',checks:[],visualReview:'pending: inspect real cockpit geometry and sightlines',fileWrites:false,passed:false};$('study-results').textContent='';$('study-error').textContent='';publish();
 try{
  status('실제 모델 준비 중');resize(844,390);const initial=await load();fixed(initial);report.provenance=initial.provenance;const baseEye=initial.camera.eyeLocal,baseFov=initial.camera.verticalFov;add('실제 모델과 기본 좌석',initial);
  for(const name of ['left','right','low','high','front','back','wide','narrow','down','up']){
   status('포즈 검사 · '+name);const s=inputPose(name);
   if(name==='left')assert(s.camera.direction[0]<-.1,'왼쪽 시선 방향 오류');if(name==='right')assert(s.camera.direction[0]>.1,'오른쪽 시선 방향 오류');
   if(name==='low'||name==='high')assert(near(s.camera.eyeLocal[1]-baseEye[1],poses[name].height),'눈높이 이동 오류');
   if(name==='front'||name==='back')assert(near(s.camera.eyeLocal[2]-baseEye[2],-poses[name].foreAft),'좌석 앞뒤 방향 오류');
   if(name==='wide'||name==='narrow')assert(near(s.camera.verticalFov,poses[name].verticalFov),'시야각 반영 오류');
   add(name,s);
  }
  pose({});
  for(const [width,height] of [[568,320],[390,844],[320,568],[844,390]]){
   status('화면 회전 · '+width+'×'+height);resize(width,height);const s=await settle();assert(s.viewport.width===width&&s.viewport.height===height,'iframe 화면 크기 불일치');assert(near(s.camera.verticalFov,baseFov),'회전으로 세로 시야각 변경');assert(s.camera.eyeLocal.every((v,i)=>near(v,baseEye[i])),'회전으로 눈 위치 변경');add(width+'×'+height,s);
  }
  for(const [seconds,expectedDistance,expectedSpeed] of [[0,0,0],[4,16,28.8],[7,40,28.8],[11,56,0]]){
   status('이동 확인 · '+seconds+'초');api().reviewAt(seconds);const s=api().runChecks();assert(near(s.motion.elapsed,seconds),'정해진 시점 불일치');assert(near(s.motion.distance,expectedDistance)&&near(s.motion.speedKmh,expectedSpeed),'가속·제동 거리/속도 불일치');
   assert(near(s.camera.eyeWorld[0]-s.camera.eyeLocal[0],0)&&near(s.camera.eyeWorld[1]-s.camera.eyeLocal[1],0)&&near(s.camera.eyeWorld[2]-s.camera.eyeLocal[2],-expectedDistance),'차체와 카메라 이동 불일치');add(seconds+'초 재생 위치',s);
  }
  api().resetMotion();pose({});status('조향 입력과 시선 연동 검사');await steeringChecks();report.passed=true;report.completedAt=new Date().toISOString();status('통과 · '+report.checks.length+'개 · 실제 화면 판독 별도','passed');
 }catch(error){report.error=error.message;report.completedAt=new Date().toISOString();$('study-error').textContent=error.message;const li=document.createElement('li');li.className='fail';li.textContent='실패 · '+error.message;$('study-results').append(li);status('확인 필요','failed');}
 finally{deadline=Infinity;lock(false);publish();}
}
$('run-study').onclick=run;
$('show-study').onclick=async()=>{if(busy)return;lock(true);deadline=performance.now()+45000;try{await load();const [w,h]=$('view-size').value.split('x').map(Number);resize(w,h);await settle();const selected=$('view-pose').value;if(selected.startsWith('steering-')){steeringStart();const direction=selected==='steering-left'?'left':'right';pointer(frame.contentDocument.getElementById('steer-'+direction),'pointerdown',++pointerSerial);fixed(api().reviewSteering(1.4));}else fixed(pose(poses[selected]));status('선택한 실제 장면 준비됨','idle');}catch(error){$('study-error').textContent=error.message;status('장면 준비 실패','failed');}finally{deadline=Infinity;lock(false);}};
function exitCapture(event){if(event.key==='Escape'&&document.body.classList.contains('capture-only')){event.preventDefault();event.stopImmediatePropagation();document.body.classList.remove('capture-only');fit();}}
