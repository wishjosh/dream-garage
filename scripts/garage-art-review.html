<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>차고와 경주 연결 검토</title><style>body{margin:0;background:#17191d;color:#eee;font:12px system-ui}header{display:flex;gap:6px;padding:4px;height:32px}button{min-height:32px}iframe{border:0;width:100%;height:calc(100dvh - 40px)}pre{position:absolute;top:40px;max-height:45vh;overflow:auto;white-space:pre-wrap;background:#101217ed;width:100%;margin:0;pointer-events:none}</style><header><button id="inspect">상태 확인</button><button id="finish">완주 흐름 검사</button><button id="clear">접기</button><output id="progress"></output></header><iframe id="game" title="격리된 미술 비교" src="/?study=garage-art&qa=1&review=1&review-persist=1&garage=1&course=circuit&look=daylight"></iframe><pre id="state" hidden></pre><script>
const frame=document.getElementById('game'),out=document.getElementById('state'),progress=document.getElementById('progress');
function snapshot(){const q=frame.contentWindow.__raceQA;if(!q)return;const s=q.snapshot();out.hidden=false;out.textContent=JSON.stringify({mode:s.mode,car:s.car,coins:s.coins,races:s.races,appearance:s.appearance,loadout:s.loadout,courseLook:s.courseScene.look,cameraFar:s.cameraFar,view:s.view,position:s.player&&{x:s.player.x,z:s.player.z,grounded:s.player.grounded},input:s.input,errors:frame.contentWindow.__cockpitReviewErrors,mainWrites:[...(window.__dreamGarageReviewMemory||new Map()).keys()]},null,2);}
document.getElementById('inspect').onclick=snapshot;document.getElementById('clear').onclick=()=>out.hidden=true;
document.getElementById('finish').onclick=async()=>{const q=frame.contentWindow.__raceQA;if(!q)return;if(q.snapshot().mode==='paused')frame.contentDocument.getElementById('resume').click();if(!['race','countdown'].includes(q.snapshot().mode))return;frame.contentWindow.__cockpitReviewSetFrozen(true);try{for(let t=0;t<900&&q.snapshot().mode!=='result';t+=10){q.advanceDriver(10);progress.textContent=t+10+' s';await new Promise(r=>setTimeout(r,0));}snapshot();}finally{frame.contentWindow.__cockpitReviewSetFrozen(false);}};
</script></html>
