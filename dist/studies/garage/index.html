<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>드림 개러지 · 꾸미기 시안 B</title><link rel="stylesheet" href="./style.css?v=mobile-scroll-2"><script type="module" src="./app.mjs?v=mobile-scroll-2"></script></head><body>
<header><div><small>DREAM GARAGE / 시안 B</small><h1>내 차를 만드는 시간</h1></div><div class="wallet"><small>시안용 상금</small><strong id="wallet">1,000 C</strong></div></header>
<main><section class="stage" aria-label="차량 감상"><canvas id="world" aria-label="선택한 차량의 실제 3D 모습"></canvas><div class="cars"><button data-car="tavaculo" aria-pressed="true">Tavaculo</button><button data-car="f2002" aria-pressed="false">클래식 F2002</button></div><div class="caption"><span id="state">차량 준비 중…</span><strong id="car-name">Tavaculo</strong><span id="look"></span></div><div class="angles"><button id="front">앞모습</button><button id="side">옆모습</button><button id="back">뒷모습</button></div></section>
<aside id="drawer" aria-label="꾸미기 선택판"><div class="drawer-toolbar"><div class="drawer-head"><h2>어떤 모습이 좋을까?</h2><button id="close" aria-label="선택판 접기">접기</button></div><nav aria-label="꾸미기 종류"><button data-category="paint" aria-pressed="true">도색</button><button data-category="wheels" aria-pressed="false">휠</button><button id="browse">목록 ↑</button></nav></div><div class="drawer-scroll"><p class="scroll-hint">위아래로 내려서 골라 보세요</p><div id="items"></div><section class="detail"><div class="detail-title"><strong id="item-name"></strong><span id="price"></span></div><p id="description"></p><div id="balance"></div><div class="actions"><button id="restore">원래대로</button><button id="apply" class="primary">장착 중</button></div><p id="status" role="status" aria-live="polite">골라 보기만 해도 차에 바로 보여요.</p></section></div></aside></main>
<footer><button id="open" class="primary">도색·휠 꾸미기</button><div><strong>직접 눌러 보는 차고 시안</strong><small>구매는 이 화면에서만 연습해요 · 실제 게임 기록과 연결되지 않아요</small></div><button id="reset">시안 초기화</button></footer><div id="error" role="alert" hidden></div></body></html>
